name: progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build progress report
        run: python tools/make_report.py build/report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: wings140_report
          path: build/report.json
