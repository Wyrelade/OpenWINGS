# DOSBox-X config for Wings ground-truth tracing (used by re/harness/run_trace.ps1)
[sdl]
output=surface
windowresolution=640x400
autolock=false
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=normal
cputype=pentium
cycles=fixed 100000
fpu=true
[mixer]
nosound=true
[sblaster]
sbtype=none
[speaker]
pcspeaker=false
[dos]
xms=true
ems=false
umb=true
[autoexec]
